<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광교 맛집 이상형 월드컵</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap');
:root{--ink:#183028;--sub:#63736b;--paper:#fffefa;--bg:#fcfaf4;--line:#e8e4d9;--g:#17684d;--mint:#e4f5e9;--coral:#f9e5dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 5% 0,#e2f4e8,transparent 30rem),radial-gradient(circle at 100% 5%,#fbe8df,transparent 26rem),var(--bg);color:var(--ink);font-family:'Noto Sans KR',sans-serif}.wrap{width:min(100%,940px);margin:auto;padding:28px 18px 46px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:33px}.brand{font-weight:800;letter-spacing:-.6px}.stamp{font-size:12px;color:var(--sub)}.intro{text-align:center;max-width:700px;margin:auto}.pill{display:inline-block;padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--g);font-size:12px;font-weight:700}.intro h1{font-size:clamp(34px,6vw,55px);line-height:1.17;letter-spacing:-3px;margin:16px 0 10px}.intro p{margin:0;color:var(--sub);font-size:14px;line-height:1.8}.notice{margin:22px auto;max-width:820px;padding:13px 16px;border-radius:14px;background:#fff5d8;border:1px solid #edd991;color:#705b19;font-size:12px;line-height:1.7}.game{padding:clamp(20px,4vw,37px);border:1px solid var(--line);border-radius:27px;background:#fffffceb;box-shadow:0 18px 55px #1c40351a}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}.round{font-size:12px;font-weight:800;color:var(--g)}.count{font-size:12px;color:var(--sub)}.bar{width:120px;height:7px;border-radius:7px;background:#e5ebe7;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:7px}.bar i{display:block;height:100%;width:0;background:var(--g);transition:.3s}.q{margin:25px 0 7px;font-size:clamp(23px,4vw,32px);line-height:1.35;letter-spacing:-1.6px}.hint{min-height:40px;color:var(--sub);font-size:13px;line-height:1.7}.choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}.choice{position:relative;min-height:194px;padding:22px;border:1.5px solid var(--line);border-radius:21px;background:var(--paper);text-align:left;font:inherit;color:inherit;cursor:pointer;transition:.2s}.choice:hover{transform:translateY(-4px);border-color:var(--g);box-shadow:0 12px 25px #17684d1c}.letter{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;background:var(--mint);color:var(--g);font-size:13px;font-weight:800}.choice:nth-child(2) .letter{background:var(--coral);color:#ad563f}.choice h3{font-size:20px;letter-spacing:-1px;margin:22px 0 7px}.choice p{margin:0;color:var(--sub);font-size:13px;line-height:1.65}.arrow{position:absolute;right:20px;bottom:15px;color:var(--g);font-size:20px}.actions{display:flex;justify-content:space-between;margin-top:17px}.linkbtn{border:0;background:none;color:var(--sub);font:inherit;font-size:13px;text-decoration:underline;cursor:pointer}.result{display:none}.result.show{display:block}.hero{padding:23px;border-radius:20px;background:linear-gradient(130deg,#145a44,#2d7b5c);color:#fff}.hero h2{font-size:29px;letter-spacing:-1.5px;margin:13px 0 7px}.hero p{margin:0;color:#dff1e5;font-size:13px;line-height:1.7}.chips,.facts{display:flex;flex-wrap:wrap;gap:5px;margin-top:12px}.chips span{padding:5px 8px;border-radius:999px;background:#ffffff22;font-size:11px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.card{padding:19px;border:1px solid var(--line);border-radius:17px;background:var(--paper)}.card.win{border-color:#a9d7bb;background:#f4fcf6}.label{font-size:11px;font-weight:800;color:var(--g)}.card h3{margin:8px 0;font-size:19px;letter-spacing:-.8px}.card p{color:var(--sub);font-size:12px;line-height:1.7;margin:10px 0 0}.facts span{background:#e9f3ed;padding:4px 6px;border-radius:6px;color:#4c6258;font-size:10px;font-weight:700}.map{display:inline-block;margin-top:12px;color:var(--g);font-size:12px;font-weight:800}.plan{margin-top:16px;padding:19px;border-radius:17px;background:#e8f5f7}.plan h3{margin:0 0 12px;font-size:17px}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.step{padding:11px;border-radius:11px;background:#ffffffa6;font-size:12px;line-height:1.6}.step b{display:block;color:#2a6b7b;font-size:10px}.check{margin-top:16px;padding:15px 17px;border-radius:0 12px 12px 0;border-left:4px solid #e27c5f;background:#fff6f2;color:#704d43;font-size:12px;line-height:1.75}.primary{margin-top:17px;padding:11px 15px;border:0;border-radius:10px;background:var(--g);color:#fff;font:700 13px 'Noto Sans KR';cursor:pointer}@media(max-width:620px){.stamp{display:none}.game{padding:20px 16px}.choices,.cards,.steps{grid-template-columns:1fr}.choice{min-height:172px}.bar{width:67px}.intro h1{letter-spacing:-2px}}
</style></head>
<body><main class="wrap"><header><div class="brand">⌇ 광교 맛집 이상형 월드컵</div><span class="stamp">SAT · 17 OCT 2026 · 19:00</span></header><section class="intro"><span class="pill">A / B로 정하는 소개팅 저녁</span><h1>오늘의 식당과 산책,<br>한 표씩 좁혀볼까요?</h1><p>매운맛·고춧가루·지나치게 뜨거운 음식 제외 · 가벼운 저녁 · 주차 · 호수 산책을 반영합니다.</p></section><div class="notice"><b>정보 기준</b> — 지정한 7개 식당만 DB에 넣었습니다. 주소·층·카테고리·주차/예약 표기는 2026년 10월 12일 네이버지도에서 확인한 내용입니다. 당일 대기, 주차 무료 시간, 양념과 날씨는 결과에서 다시 확인하도록 안내합니다.</div><section class="game"><div id="quiz"><div class="top"><b class="round" id="round"></b><span class="count" id="count"></span></div><h2 class="q" id="q"></h2><div class="hint" id="hint"></div><div class="choices" id="choices"></div><div class="actions"><button class="linkbtn" id="back">← 이전 질문</button><button class="linkbtn" id="no">둘 다 별로예요 ↻</button></div></div><div class="result" id="result"></div></section></main>
<script>
const db={
forkner:{n:'포크너 광교아브뉴프랑점',c:'양식',f:'1층',a:'수원시 영통구 센트럴타운로 85 1층 B128·129호',m:'파스타 · 리조또 · 샐러드',r:'평점 4.87 · 리뷰 2,269',x:'예약·주차 표기',hot:1,u:'포크너 광교아브뉴프랑점'},
mike:{n:'미케 광교아브뉴프랑 본점',c:'일식',f:'1층',a:'수원시 영통구 센트럴타운로 85 1층 B108-1호',m:'카이센동 · 히츠마부시 · 오야코동',r:'리뷰 1,282',x:'예약·주차 표기',hot:0,u:'미케 광교아브뉴프랑 본점'},
morning:{n:'세상의 모든 아침 광교',c:'미확인',f:'미확인',a:'네이버지도에서 현재 일치 매장 확인 불가',m:'후보 제외',r:'실제 영업 확인 필요',x:'미확인',bad:1,u:'세상의 모든 아침 광교'},
sot:{n:'솥밥신 갤러리아백화점 광교점',c:'한식',f:'9층',a:'수원시 영통구 광교중앙로 124 9층',m:'도미 · 전복 · 고등어 솥밥',r:'리뷰 1,434',x:'예약·주차 표기',hot:1,u:'솥밥신 갤러리아백화점 광교점'},
yang:{n:'양산도 수원광교점',c:'일식',f:'지하 1층',a:'수원시 영통구 광교중앙로 145 지하 1층',m:'히츠마부시 · 사케동 · 부타동',r:'리뷰 3,109',x:'예약·주차 표기',hot:1,u:'양산도 수원광교점'},
amano:{n:'아마노',c:'양식',f:'2층',a:'수원시 영통구 법조로 25 SK뷰레이크 근린생활타워 2층 215호',m:'파스타 · 감바스 · 샐러드',r:'평점 4.91 · 리뷰 2,293',x:'예약·주차 표기',hot:1,u:'아마노 광교'},
bbok:{n:'뽁식당 광교카페거리점',c:'양식',f:'1층',a:'수원시 영통구 센트럴파크로127번길 47 1층',m:'파스타 · 리조또 · 피자 · 수프',r:'리뷰 3,712',x:'예약·주차 표기',hot:1,u:'뽁식당 광교카페거리점'}};
let s=0,ans=[],food='',finals=[];const $=x=>document.querySelector(x);
function qs(){let first={round:'ROUND 1 · 음식',q:'오늘은 한식과 일식 중 어느 쪽이 더 끌려요?',h:'매운맛·고춧가루·펄펄 끓는 음식은 공통으로 제외합니다.',o:[['한식','정갈한 밥 메뉴. 단, 뜨거운 솥밥은 조건 충돌 여부를 따져요.','한식'],['일식','차갑고 가벼운 한 접시를 먼저 봐요.','일식']]};let second={round:'ROUND 1 · 음식',q:(food||'선택한 음식')+'과 양식, 오늘의 최종 음식 취향은?',h:'양식은 파스타·샐러드 계열이지만 뜨거운 메뉴가 많아 마지막에 다시 걸러집니다.',o:[[food||'일식','현재 고른 음식 취향을 유지합니다.',food||'일식'],['양식','1층 양식 후보를 비교해 봐요.','양식']]};return[first,second,{round:'ROUND 2 · 분위기',q:'분위기는 어느 쪽이 더 좋아요?',h:'토요일 저녁에는 대화하기 편한 자리와 실시간 대기 확인이 중요해요.',o:[['대화가 편한 아늑함','음식보다 이야기가 중심인 선택.','calm'],['세련된 데이트 무드','조금 더 특별한 분위기를 우선.','special']]},{round:'ROUND 2 · 분위기',q:'오늘은 편안함과 특별함 중 무엇을 더 원하나요?',h:'낮 일정 뒤라 긴 식사보다 산뜻하게 마무리하는 흐름을 추천해요.',o:[['캐주얼하게','부담 없이 먹고 산책으로 이어가기.','casual'],['조금 특별하게','분위기와 메뉴를 한 단계 더 챙기기.','occasion']]},{round:'ROUND 4 · 주차',q:'주차는 어떤 방식을 우선할까요?',h:'무료 시간·등록 방법·주말 혼잡은 매장에 최종 확인해야 합니다.',o:[['식당 건물 주차','이동을 줄이는 선택.','building'],['주변 주차장도 가능','호수공원 가까움과 1층을 더 우선.','nearby']]},{round:'ROUND 4 · 산책',q:'식사 후에는 무엇이 더 중요해요?',h:'비나 강풍이면 산책 대신 인근 실내 카페로 전환합니다.',o:[['호수공원 가까움','산책으로 바로 이어지는 위치가 좋아요.','lake'],['주차 편의','차를 찾기 쉬운 동선이 좋아요.','parking']]}]}
function render(){let v=qs()[s];$('#round').textContent=v.round;$('#count').innerHTML=(s+1)+' / 8 <span class="bar"><i style="width:'+((s+1)/8*100)+'%"></i></span>';$('#q').textContent=v.q;$('#hint').textContent=v.h;$('#back').style.visibility=s?'visible':'hidden';$('#choices').innerHTML=v.o.map((x,i)=>'<button class="choice" data-v="'+x[2]+'"><span class="letter">'+(i?'B':'A')+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p><span class="arrow">→</span></button>').join('');document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>go(b.dataset.v))}
function go(v){ans[s]=v;if(s===0)food=v;s++;if(s<qs().length)render();else round3(0)}
function candidates(){let type=ans[1];return Object.keys(db).filter(k=>!db[k].bad&&db[k].c===type).sort((a,b)=>(db[a].f==='1층'&&!db[a].hot?0:1)-(db[b].f==='1층'&&!db[b].hot?0:1))}
function round3(){let list=candidates(), all=Object.keys(db).filter(k=>!db[k].bad&&db[k].f==='1층'), x=list[0]||all[0],y=list[1]||all[1];let A=db[x],B=db[y];$('#round').textContent='ROUND 3 · 실제 식당';$('#count').innerHTML='7 / 8 <span class="bar"><i style="width:87.5%"></i></span>';$('#q').textContent='실제 후보 두 곳 중, 오늘은 어디가 더 맞나요?';$('#hint').textContent='주소·층·카테고리·주차/예약 표기는 네이버지도 기준입니다. 양념·온도·대기는 출발 전 확인해요.';$('#choices').innerHTML=[A,B].map((p,i)=>'<button class="choice" data-n="'+p.n+'"><span class="letter">'+(i?'B':'A')+'</span><h3>'+p.n+'</h3><p>'+p.c+' · '+p.f+' · '+p.m+' · '+p.x+'</p><span class="arrow">→</span></button>').join('');document.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{finals=[b.dataset.n,b.dataset.n===A.n?B.n:A.n];duel()})}
function duel(){let pool=Object.values(db).filter(p=>!p.bad&&p.f==='1층'),a=finals[0]||pool[0].n,b=finals[1]||pool[1].n;$('#round').textContent='ROUND 5 · 최종 후보';$('#count').textContent='FINAL';$('#q').textContent='마지막 한 표! 오늘의 우승 식당은?';$('#hint').textContent='선택하면 주문·주차 확인·산책까지 한 번에 정리됩니다.';$('#choices').innerHTML=[a,b].map((n,i)=>{let p=Object.values(db).find(z=>z.n===n);return '<button class="choice" data-win="'+n+'"><span class="letter">'+(i?'B':'A')+'</span><h3>'+n+'</h3><p>'+p.m+' · '+p.f+' · '+p.x+'</p><span class="arrow">★</span></button>'}).join('');document.querySelectorAll('[data-win]').forEach(b=>b.onclick=()=>show(b.dataset.win))}
function card(p,win){return '<article class="card '+(win?'win':'')+'"><span class="label">'+(win?'WINNER':'BACKUP')+'</span><h3>'+p.n+'</h3><div class="facts"><span>'+p.c+'</span><span>'+p.f+'</span><span>'+p.r+'</span><span>'+p.x+'</span></div><p><b>주소</b> '+p.a+'<br><b>대표 메뉴</b> '+p.m+'<br><b>주의</b> '+(p.hot?'뜨거운 메뉴 비중이 있어 주문 전 온도·양념 확인 필요':'차가운 메뉴 후보가 확인됨')+'</p><a class="map" target="_blank" href="https://map.naver.com/p/search/'+encodeURIComponent(p.u)+'">네이버지도에서 확인하기 ↗</a></article>'}
function show(n){let p=Object.values(db).find(z=>z.n===n),alt=Object.values(db).find(z=>z.n===finals.find(q=>q!==n))||db.mike;let order=p===db.mike?'카이센동 2개를 기본으로, 추가 메뉴는 배고픔을 보고 1개만':'차갑거나 덜 뜨거운 메뉴, 고춧가루·매운 소스 제외 가능 여부를 먼저 확인한 뒤 2개 이내로 나눠 주문';$('#quiz').style.display='none';$('#result').innerHTML='<div class="hero"><span class="pill">FINAL PICK</span><h2>'+p.n+'</h2><p>선택 취향과 네이버지도 확인 정보를 바탕으로 한 최종 후보입니다. 실시간 대기·주차비·메뉴 양념은 확정 정보가 아닙니다.</p><div class="chips"><span>'+p.c+'</span><span>'+p.f+'</span><span>'+p.x+'</span></div></div><div class="cards">'+card(p,1)+card(alt,0)+'</div><section class="plan"><h3>19:00–22:00 실행 코스</h3><div class="steps"><div class="step"><b>19:00 — DINNER</b>'+order+'</div><div class="step"><b>20:15 — WALK</b>광교호수공원 쪽으로 이동해 45~60분 가볍게 산책. 출발 전 지도 길찾기로 실제 도보 시간을 확인하세요.</div><div class="step"><b>RAIN PLAN</b>비·강풍이면 호수 산책 대신 식당 건물 또는 인근 실내 카페에서 대화 연장.</div></div></section><div class="check"><b>출발 전 4가지 확인</b><br>① 10월 17일 19–22시 기온·강수확률·강수량·풍속(아직 확정 예보 시점 아님) ② 토요일 19시 예약/대기 ③ 주차 등록·무료 시간·주차비 ④ 고춧가루·매운 소스·뜨거운 제공 여부.</div><button class="primary" onclick="restart()">처음부터 다시 하기</button>';$('#result').classList.add('show')}
function restart(){s=0;ans=[];food='';finals=[];$('#result').classList.remove('show');$('#quiz').style.display='block';render()}$('#back').onclick=()=>{if(s){s--;render()}};$('#no').onclick=()=>{$('#choices').append($('#choices').firstElementChild)};render();
</script></body></html>
